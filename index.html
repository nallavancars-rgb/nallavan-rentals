<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111418" />
    <title>Nallavan Rentals | Premium Car &amp; Bike Rental in Madurai</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
      body { font-family: 'DM Sans', sans-serif; background-color: #121212; color: white; }
      .glass-panel { background: rgba(30,30,30,.7); backdrop-filter: blur(10px); border: 1px solid rgba(192,192,192,.2); }
      .gold-gradient-text { background: linear-gradient(to right,#d4af37,#f3e5ab); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .brand-lockup { display:flex; align-items:center; gap:.75rem; }
      .brand-logo { width:68px; height:auto; max-height:58px; object-fit:contain; display:block; }
      .brand-wordmark { display:flex; flex-direction:column; line-height:1; }
      .brand-wordmark .brand-main { font-size:.95rem; font-weight:700; letter-spacing:.1em; color:#f5f5f5; }
      .brand-wordmark .brand-sub { font-size:.58rem; font-weight:600; letter-spacing:.3em; color:#c0c2c6; margin-top:.2rem; }
      .fleet-car-image { display:block; width:100%; aspect-ratio:16/10; object-fit:cover; }
      .fleet-card-visual { display:grid; aspect-ratio:16/10; place-items:center; }
      .fleet-logo-placeholder { display:block; width:clamp(92px,42%,140px); max-height:78%; object-fit:contain; }
      .hero-media .hero-brand-mark { width:42%; height:42%; margin:auto; object-fit:contain; }
      html { scroll-behavior:smooth; }
      input:disabled, select:disabled { opacity:.5; cursor:not-allowed; }
    </style>
  </head>
  <body class="antialiased editorial-theme">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
